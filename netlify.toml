[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Pure static export — don't let Netlify wrap it in the Next.js server runtime.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # Participant search API (runs on the private Ubuntu server behind Cloudflare Tunnel).
  NEXT_PUBLIC_API_URL = "https://p2s1-cdn.stanleyowen.com"

# Keeps generated AVIF/WebP between builds so only changed photos are re-encoded.
[[plugins]]
  package = "./netlify/plugins/image-cache"

# ── Security headers (the Content-Security-Policy is generated per build into out/_headers) ──
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# ── Caching: hashed assets are immutable ──
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Old URLs from the 2023/2024 site ──
[[redirects]]
  from = "/2023/about"
  to = "/2023#story"
  status = 301

[[redirects]]
  from = "/2024/about"
  to = "/2024#story"
  status = 301

[[redirects]]
  from = "/2023/search"
  to = "/2023#results"
  status = 301

[[redirects]]
  from = "/2024/search"
  to = "/2024#results"
  status = 301

[[redirects]]
  from = "/components/*"
  to = "/"
  status = 301
