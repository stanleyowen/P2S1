# P2S1 participant API + Cloudflare Tunnel.
#
#   cp .env.example .env    # fill in CLOUDFLARE_TUNNEL_TOKEN
#   docker compose --profile tunnel up -d --build
#
# No ports are opened on your router: cloudflared dials out to Cloudflare, and Cloudflare
# forwards https://p2s1-cdn.stanleyowen.com → http://api:8080 inside this compose network.
# If you already run cloudflared on the host, skip the `tunnel` profile and point your
# existing tunnel's public hostname at http://127.0.0.1:8787 instead.

services:
  api:
    build: .
    image: p2s1-api:latest
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://p2s1.netlify.app}
      TRUST_PROXY: cloudflare
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
    volumes:
      - ./data:/data:ro # normalized <year>.json files; never baked into the image
    ports:
      - "127.0.0.1:8787:8080" # loopback only — not reachable from the LAN or internet
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    networks: [p2s1]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    # Dedicated tunnel for this API only; every request on it goes to the api container.
    command: tunnel --no-autoupdate run --url http://api:8080
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in server/.env}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    networks: [p2s1]

networks:
  p2s1:
